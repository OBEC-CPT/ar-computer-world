<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Balloon Pop - เกมแตะลูกโป่งด้วยมือ (Hand Tracking)</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- MediaPipe Hand Tracking Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
    
    body {
      background: #0f172a;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* ซ่อน HTML Video ตัวจริงไว้ ใช้ canvas วาดแทน */
    #input-video { display: none; }

    #output-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* แถบแดชบอร์ดแสดงคะแนน */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .score-board {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 12px 25px;
      border-radius: 50px;
      border: 2px solid #00f2fe;
      font-size: 1.5rem;
      font-weight: 600;
      color: #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }

    .guide-box {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      font-size: 1rem;
    }

    .btn-start {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0, 114, 255, 0.5);
      transition: all 0.3s ease;
    }

    .btn-start:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 15px 40px rgba(0, 242, 254, 0.8);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- แถบแสดงคะแนนและคำแนะนำ -->
    <div class="hud">
      <div class="score-board">
        <i class="fa-solid fa-star" style="color:#ffd700;"></i> คะแนน: <span id="score-text">0</span>
      </div>
      <div class="guide-box">
        <i class="fa-solid fa-hand-pointer" style="color:#00f2fe;"></i> ใช้นิ้วชี้จิ้มลูกโป่งคำถามที่<b>"ถูกต้อง"</b>
      </div>
    </div>

    <button id="start-btn" class="btn-start" onclick="startGame()">
      <i class="fa-solid fa-play"></i> เริ่มเล่นเกมแตะลูกโป่ง
    </button>

    <!-- กล้องเว็บแคมและ Canvas วาดผลลัพธ์ -->
    <video id="input-video" playsinline></video>
    <canvas id="output-canvas" width="1280" height="720"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let gameActive = false;
    let balloons = [];
    let handPoint = { x: 0, y: 0, visible: false };

    // คลังคำถามลูกโป่ง (ข้อความ, ความถูกต้อง true/false)
    const questionPool = [
      { text: "CPU: ประมวลผล", isCorrect: true },
      { text: "RAM: ความจำชั่วคราว", isCorrect: true },
      { text: "Mouse: หน่วยแสดงผล", isCorrect: false },
      { text: "Monitor: หน่วยรับข้อมูล", isCorrect: false },
      { text: "GPU: ประมวลผลกราฟิก", isCorrect: true },
      { text: "Keyboard: หน่วยส่งออก", isCorrect: false },
      { text: "SSD: บันทึกข้อมูล", isCorrect: true },
      { text: "Printer: หน่วยรับเข้า", isCorrect: false }
    ];

    // ตั้งค่า MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // ระบบตรวจจับพิกัดนิ้วมือ
    function onResults(results) {
      // วาดภาพภาพจากกล้องแบบสลับซ้ายขวา (Mirror)
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // ตำแหน่ง 8 คือ ปลายนิ้วชี้ (Index Finger Tip)
        const indexTip = landmarks[8];

        handPoint.x = (1 - indexTip.x) * canvasElement.width; // ปรับพิกัดตามการ Mirror
        handPoint.y = indexTip.y * canvasElement.height;
        handPoint.visible = true;

        // วาดจุดเล็งเป้าหมายที่ปลายนิ้วชี้
        canvasCtx.restore();
        drawFingerTarget(handPoint.x, handPoint.y);
      } else {
        handPoint.visible = false;
        canvasCtx.restore();
      }

      if (gameActive) {
        updateAndDrawBalloons();
      }
    }

    // วาดวงกลมเป้าหมายตามนิ้วชี้
    function drawFingerTarget(x, y) {
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 15, 0, 2 * Math.PI);
      canvasCtx.fillStyle = '#ff0055';
      canvasCtx.fill();
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = '#ffffff';
      canvasCtx.stroke();
    }

    // สร้างลูกโป่งใหม่
    function spawnBalloon() {
      if (!gameActive) return;
      const q = questionPool[Math.floor(Math.random() * questionPool.length)];
      balloons.push({
        x: Math.random() * (canvasElement.width - 200) + 100,
        y: canvasElement.height + 60,
        radius: 65,
        speed: Math.random() * 2 + 2,
        text: q.text,
        isCorrect: q.isCorrect,
        color: q.isCorrect ? '#00c6ff' : '#ff4757'
      });
    }

    // อัปเดตตำแหน่งลูกโป่งและตรวจเช็กการชนกับนิ้วมือ
    function updateAndDrawBalloons() {
      for (let i = balloons.length - 1; i >= 0; i--) {
        let b = balloons[i];
        b.y -= b.speed; // ลูกโป่งลอยขึ้นด้านบน

        // วาดตัวลูกโป่ง
        canvasCtx.beginPath();
        canvasCtx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        canvasCtx.fillStyle = b.color;
        canvasCtx.globalAlpha = 0.85;
        canvasCtx.fill();
        canvasCtx.lineWidth = 3;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.stroke();
        canvasCtx.globalAlpha = 1.0;

        // วาดข้อความคำถามในลูกโป่ง
        canvasCtx.fillStyle = '#ffffff';
        canvasCtx.font = 'bold 18px Kanit';
        canvasCtx.textAlign = 'center';
        canvasCtx.fillText(b.text, b.x, b.y + 6);

        // เช็กว่านิ้วชี้เอื้อมมาแตะลูกโป่งหรือไม่ (Collision Detection)
        if (handPoint.visible) {
          let dist = Math.hypot(handPoint.x - b.x, handPoint.y - b.y);
          if (dist < b.radius + 15) { // แตะถูกลูกโป่ง
            if (b.isCorrect) {
              score += 10;
              showPopEffect(b.x, b.y, "+10", "#2ed573");
            } else {
              score = Math.max(0, score - 5);
              showPopEffect(b.x, b.y, "-5", "#ff4757");
            }
            scoreText.innerText = score;
            balloons.splice(i, 1);
            continue;
          }
        }

        // ลบลูกโป่งออกเมื่อลอยเลยขอบบน
        if (b.y < -b.radius) {
          balloons.splice(i, 1);
        }
      }
    }

    // แสดง Effect ข้อความเมื่อลูกโป่งแตก
    function showPopEffect(x, y, text, color) {
      canvasCtx.fillStyle = color;
      canvasCtx.font = 'bold 35px Kanit';
      canvasCtx.fillText(text, x, y);
    }

    // เริ่มต้นระบบกล้องและเกม
    async function startGame() {
      startBtn.style.display = 'none';
      score = 0;
      scoreText.innerText = score;
      gameActive = true;

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });

      await camera.start();
      
      // ให้ลูกโป่งทยอยลอยขึ้นมาทุกๆ 1.5 วินาที
      setInterval(spawnBalloon, 1500);
    }
  </script>
</body>
</html>
